<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hospital Management Logo - white version" >
  <!-- Thin subtle outline to define the logo on light backgrounds -->
  <defs>
    <style>
      .bg{fill:#ffffff; stroke:#e5e7eb; stroke-width:4}
      .cross{fill:#ffffff; stroke:#e5e7eb; stroke-width:6; stroke-linecap:round}
      .gear{fill:#ffffff; stroke:#e5e7eb; stroke-width:6}
      .glow{fill:url(#glow); opacity:0.25}
      .shadow{filter:url(#shadow)}
    </style>
    <!-- soft outer glow for polish on dark backgrounds -->
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Outer badge / shield shape -->
  <path class="bg" d="M150 24
                        L262 78
                        Q276 92 276 110
                        L276 196
                        Q276 214 262 230
                        L150 294
                        L38 230
                        Q24 214 24 196
                        L24 110
                        Q24 92 38 78
                        Z"/>

  <!-- Subtle glow for polish -->
  <ellipse class="glow" cx="150" cy="150" rx="120" ry="60"/>

  <!-- Medical cross formed by two white bars with light gray outline for visibility -->
  <g class="cross" transform="translate(110,105)">
    <!-- vertical bar -->
    <rect x="16" y="0" width="40" height="120" rx="8"/>
    <!-- horizontal bar -->
    <rect x="0" y="40" width="120" height="40" rx="8"/>
  </g>

  <!-- Gear to symbolize management, kept white with a light outline -->
  <g class="gear" transform="translate(112,194) scale(0.8)">
    <circle cx="0" cy="0" r="34" fill="#ffffff" stroke="#e5e7eb" stroke-width="6"/>
    <!-- teeth around a circle -->
    <g fill="#ffffff" stroke="#e5e7eb" stroke-width="6">
      <rect x="-54" y="-12" width="8" height="24" rx="2"/>
      <rect x="46" y="-12" width="8" height="24" rx="2"/>
      <rect x="-6" y="-58" width="24" height="8" rx="2"/>
      <rect x="-6" y="46" width="24" height="8" rx="2"/>
      <rect x="-34" y="-34" width="8" height="24" rx="2"/>
      <rect x="26" y="-34" width="8" height="24" rx="2"/>
      <rect x="-34" y="10" width="8" height="24" rx="2"/>
      <rect x="26" y="10" width="8" height="24" rx="2"/>
    </g>
    <circle cx="0" cy="0" r="12" fill="#e5e7eb"/>
  </g>

  <!-- Optional edge highlight to visually separate logo from background on light pages -->
  <path d="M24 110 L276 110" stroke="#e5e7eb" stroke-width="2" opacity="0.25" />

  <!-- Accessibility: invisible text for screen readers -->
  <text x="50%" y="290" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="transparent" aria-label="Hospital Management Logo white version"/>
</svg>